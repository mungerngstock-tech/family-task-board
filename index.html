<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭任務追蹤板</title>
<style>
  :root {
    --bg: #f5f5f5; --card: #fff; --text: #333; --muted: #888;
    --accent: #2563eb; --kid: #ec4899; --worker: #f59e0b; --adult: #10b981;
    --border: #e5e5e5; --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height:1.6; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: .9rem; transition: all .2s; }
  .tab:hover { border-color: var(--accent); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab.kid.active { background: var(--kid); border-color: var(--kid); }
  .tab.worker.active { background: var(--worker); border-color: var(--worker); }
  .tab.adult.active { background: var(--adult); border-color: var(--adult); }
  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task-card { background: var(--card); border-radius: 10px; padding: 16px 20px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: flex-start; }
  .task-card.kid { border-left: 4px solid var(--kid); }
  .task-card.worker { border-left: 4px solid var(--worker); }
  .task-card.adult { border-left: 4px solid var(--adult); }
  .task-icon { font-size: 1.4rem; min-width: 32px; text-align: center; }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-weight: 600; font-size: 1rem; }
  .task-meta { display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
  .task-meta span { font-size: .8rem; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: .75rem; font-weight: 500; color: #fff; }
  .badge.kid { background: var(--kid); } .badge.worker { background: var(--worker); } .badge.adult { background: var(--adult); }
  .task-detail { font-size: .85rem; color: #555; margin-top: 6px; }
  .task-detail a { color: var(--accent); }
  .empty { text-align: center; padding: 40px; color: var(--muted); }
  .today-badge { background: #dc2626; color: #fff; font-size: .7rem; padding: 2px 8px; border-radius: 8px; margin-left: 6px; }
  .date-display { font-size: .8rem; color: var(--muted); margin-bottom: 16px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .error { text-align: center; padding: 40px; color: #dc2626; }
</style>
</head>
<body>
<div class="container">
  <h1>家庭任務追蹤板</h1>
  <p class="subtitle">資料來源：<code>家庭任务.md</code> · 自動同步</p>
  <div class="date-display" id="todayDisplay"></div>
  <div class="tabs">
    <button class="tab active" onclick="filter('all')">全部</button>
    <button class="tab kid" onclick="filter('小孩')">小孩</button>
    <button class="tab worker" onclick="filter('工人')">工人</button>
    <button class="tab adult" onclick="filter('大人')">大人</button>
    <button class="tab" onclick="filter('today')">今日</button>
  </div>
  <div class="task-list" id="taskList"><div class="loading">載入中...</div></div>
</div>

<script>
const MD_URL = "https://raw.githubusercontent.com/mungerngstock-tech/family-task-board/main/%E5%AE%B6%E5%BA%AD%E4%BB%BB%E5%8A%A1.md";
const ICON_MAP = [
  [["圖書館","图书馆","续借","續借"],"📚"],
  [["冰箱","雪櫃"],"🧊"],
  [["手錶","手表","充電","充电"],"⌚"],
  [["吸塵","吸尘","吸塵器","吸尘器"],"🔌"],
  [["食材","庫存","库存","盤點","盘点","雞蛋","鸡蛋"],"🥚"],
  [["洗衣","密封"],"🌀"],
  [["濾水","滤水"],"💧"],
  [["都會票","都会票","MTR","地鐵","地铁"],"🚇"],
  [["車船","车船","津貼","津贴"],"📝"],
  [["管理費","管理费"],"🏠"],
];
const DAY_NAMES = ["sun","mon","tue","wed","thu","fri","sat"];
const today = new Date();
const TODAY_DAY = DAY_NAMES[today.getDay()];
const TODAY_DATE = today.getDate();
let TASKS = [];

document.getElementById("todayDisplay").textContent =
  `今天是 ${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日 星期${["日","一","二","三","四","五","六"][today.getDay()]}`;

function getIcon(name, detail) {
  for (const [keywords, icon] of ICON_MAP) {
    for (const kw of keywords) {
      if (name.includes(kw) || (detail && detail.includes(kw))) return icon;
    }
  }
  return "📋";
}

function parseFreq(freq) {
  const days = [];
  const daysOfMonth = [];
  const dayMap = { "日":"sun","一":"mon","二":"tue","三":"wed","四":"thu","五":"fri","六":"sat" };
  const weekMatch = freq.match(/每週([一二三四五六日、]+)/);
  if (weekMatch) {
    const raw = weekMatch[1].replace(/、/g,"");
    for (const ch of raw) { if (dayMap[ch]) days.push(dayMap[ch]); }
  }
  const monthMatch = freq.match(/每月(\d+)號/);
  if (monthMatch) {
    daysOfMonth.push(parseInt(monthMatch[1]));
  }
  return { days, daysOfMonth };
}

function isTodayTask(t) {
  if (t.days && t.days.includes(TODAY_DAY)) return true;
  if (t.daysOfMonth && t.daysOfMonth.includes(TODAY_DATE)) return true;
  return false;
}

function linkify(text) {
  const urlRe = /(https?:\/\/[^\s\)]+)/g;
  return text.replace(urlRe, '<a href="$1" target="_blank">$1</a>');
}

function parseMD(md) {
  const lines = md.split("\n");
  const tasks = [];
  let inTable = false;
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    if (trimmed.startsWith("|") && !trimmed.startsWith("|---") && !trimmed.includes("assignee")) {
      const cols = trimmed.split("|").map(c => c.trim()).filter(c => c);
      if (cols.length >= 4) {
        const [assignee, name, freq, detail] = cols;
        const { days, daysOfMonth } = parseFreq(freq);
        tasks.push({
          assignee, name, freq, detail,
          icon: getIcon(name, detail),
          days, daysOfMonth
        });
      }
    }
  }
  return tasks;
}

async function load() {
  try {
    const resp = await fetch(MD_URL);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const md = await resp.text();
    TASKS = parseMD(md);
    filter("all");
  } catch (e) {
    document.getElementById("taskList").innerHTML =
      '<div class="error">無法載入任務資料：' + e.message + '</div>';
  }
}

function filter(role) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  if (role === "all") document.querySelectorAll(".tab")[0].classList.add("active");
  else if (role === "today") document.querySelectorAll(".tab")[4].classList.add("active");
  else {
    document.querySelectorAll(".tab").forEach(t => {
      if (t.textContent === role) t.classList.add("active");
    });
  }

  let filtered = TASKS;
  if (role === "today") {
    filtered = TASKS.filter(isTodayTask);
  } else if (role !== "all") {
    filtered = TASKS.filter(t => t.assignee === role);
  }

  const list = document.getElementById("taskList");
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">暫無任務</div>';
    return;
  }
  list.innerHTML = filtered.map(t => `
    <div class="task-card ${t.assignee==="小孩"?"kid":t.assignee==="工人"?"worker":"adult"}">
      <div class="task-icon">${t.icon}</div>
      <div class="task-body">
        <div class="task-name">
          ${t.name}
          ${isTodayTask(t) ? '<span class="today-badge">今天</span>' : ''}
          <span class="badge ${t.assignee==="小孩"?"kid":t.assignee==="工人"?"worker":"adult"}">${t.assignee}</span>
        </div>
        <div class="task-meta"><span>⏱ ${t.freq}</span></div>
        ${t.detail ? `<div class="task-detail">${linkify(t.detail)}</div>` : ''}
      </div>
    </div>
  `).join("");
}

load();
</script>
</body>
</html>
